name: Build & Publish Meskot APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v1.0.0). Leave blank to publish to latest.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          elif [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare app/google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_RAW: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os, sys

          raw = os.environ.get("GOOGLE_SERVICES_JSON_RAW", "")
          b64 = os.environ.get("GOOGLE_SERVICES_JSON_B64", "")

          if not raw and b64:
              raw = base64.b64decode(b64.strip()).decode("utf-8-sig")

          if raw:
              # Strip BOM, whitespace, markdown fences, and any stray trailing text after the JSON object
              text = raw.lstrip("\ufeff").strip()
              start = text.find("{")
              if start == -1:
                  print("::error::GOOGLE_SERVICES_JSON secret does not contain a JSON object starting with '{'.")
                  sys.exit(1)
              try:
                  obj, _ = json.JSONDecoder().raw_decode(text, start)
              except json.JSONDecodeError as exc:
                  print(f"::error::Invalid JSON in GOOGLE_SERVICES_JSON secret: {exc}")
                  sys.exit(1)
              with open("app/google-services.json", "w", encoding="utf-8") as f:
                  json.dump(obj, f, indent=2)
                  f.write("\n")

          if not os.path.isfile("app/google-services.json"):
              print("::error::Missing app/google-services.json! Add a GitHub Actions repository secret named GOOGLE_SERVICES_JSON containing your google-services.json file, then re-run this workflow.")
              sys.exit(1)

          # Final strict validation
          with open("app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if "project_info" not in data or "client" not in data:
              print("::error::app/google-services.json is missing required 'project_info' or 'client' keys.")
              sys.exit(1)
          print("Validated app/google-services.json successfully.")
          PY

      - name: Build Release and Debug APKs
        run: gradle :app:assembleRelease :app:assembleDebug --no-daemon

      - name: Stage APKs for upload
        shell: bash
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-release.apk release-apks/Meskot-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/Meskot-debug.apk
          ls -lh release-apks/

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meskot-apks
          path: release-apks/*.apk
          retention-days: 30

      - name: Determine release tag
        id: tag_info
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Meskot Android (${{ steps.tag_info.outputs.tag }})
          prerelease: ${{ steps.tag_info.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release-apks/Meskot-release.apk
            release-apks/Meskot-debug.apk
